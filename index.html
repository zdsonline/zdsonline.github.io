<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="简易收音机">
  <meta name="description" content="轻量的网络收音机">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/app.css">
  <title>简易收音机</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">◖)))</div>
      <h1>简易收音机</h1>
      <p class="subtitle">网络广播 · Internet Radio</p>
    </header>

    <section class="now-playing" aria-live="polite">
      <div class="eyebrow">正在收听</div>
      <div id="stationName" class="station-name">选择一个电台</div>
      <div id="stationDetail" class="station-detail">点击下方频道开始播放</div>
      <button id="playButton" class="play-button" type="button" aria-label="播放" disabled>
        <span id="playIcon" aria-hidden="true">▶</span>
      </button>
      <div id="status" class="status">待机中</div>
    </section>

    <section class="stations-section">
      <div class="section-heading">电台频道</div>
      <div id="stationList" class="station-list"></div>
    </section>

    <section class="custom-section">
      <label class="section-heading" for="customUrl">播放其他电台</label>
      <form id="customForm" class="custom-form">
        <input id="customUrl" type="url" inputmode="url" autocomplete="url"
          placeholder="粘贴电台直播流地址" aria-label="电台直播流地址" required>
        <button type="submit">播放</button>
      </form>
      <p class="hint">支持浏览器可直接播放的音频流地址；部分 HLS/m3u8 地址可能无法播放。</p>
    </section>

    <footer id="appVersion" class="footer">离线可用（需先成功打开一次）</footer>
  </main>

  <audio id="audio" preload="none" playsinline></audio>
  <script src="./js/stations.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
